<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoltRack v0 - Your AI Bot</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
      min-height: 100vh;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: rgba(0, 0, 0, 0.2);
      color: white;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    header p {
      opacity: 0.8;
      font-size: 14px;
    }

    main {
      flex: 1;
      display: flex;
      gap: 20px;
      padding: 20px;
      overflow: hidden;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .bot-setup {
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      overflow-y: auto;
    }

    .chat-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      padding: 24px;
      flex-shrink: 0;
    }

    .form-group {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-weight: 500;
      margin-bottom: 6px;
      font-size: 14px;
      color: #333;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      transition: transform 0.2s;
      width: 100%;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .button-group {
      display: flex;
      gap: 10px;
    }

    .button-group button {
      flex: 1;
    }

    .btn-small {
      padding: 6px 12px;
      font-size: 12px;
      width: auto;
    }

    .btn-danger {
      background: #dc3545;
    }

    .btn-secondary {
      background: #6c757d;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 500;
      font-size: 12px;
      margin: 10px 0;
    }

    .status-badge.running {
      background: #d4edda;
      color: #155724;
    }

    .status-badge.stopped {
      background: #f8d7da;
      color: #721c24;
    }

    .status-badge.loading {
      background: #fff3cd;
      color: #856404;
    }

    .bot-info-display {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 6px;
      font-size: 13px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
    }

    .info-label {
      font-weight: 600;
      color: #666;
    }

    .info-value {
      color: #333;
      word-break: break-all;
    }

    .token-display {
      background: #f0f0f0;
      padding: 8px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      margin: 8px 0;
      overflow-x: auto;
    }

    .chat-header {
      margin-bottom: 20px;
    }

    .chat-header h2 {
      font-size: 24px;
      margin-bottom: 5px;
      color: white;
    }

    .chat-header p {
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
    }

    .chat-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 15px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      display: flex;
      gap: 10px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .message-content {
      max-width: 70%;
      padding: 12px 15px;
      border-radius: 12px;
      word-wrap: break-word;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.user .message-content {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .message.bot .message-content {
      background: #f0f0f0;
      color: #333;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    .input-area input {
      flex: 1;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }

    .input-area button {
      padding: 12px 24px;
      width: auto;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #999;
    }

    .empty-state p {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .error-message {
      background: #f8d7da;
      color: #721c24;
      padding: 12px 15px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .success-message {
      background: #d4edda;
      color: #155724;
      padding: 12px 15px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(0, 0, 0, 0.1);
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    footer {
      background: rgba(0, 0, 0, 0.2);
      color: rgba(255, 255, 255, 0.8);
      padding: 15px;
      text-align: center;
      font-size: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    @media (max-width: 1000px) {
      main {
        flex-direction: column;
      }

      .bot-setup {
        width: 100%;
        max-height: 300px;
        flex-direction: row;
        overflow-x: auto;
        overflow-y: hidden;
      }

      .bot-setup .card {
        min-width: 280px;
      }

      .messages {
        max-height: 400px;
      }
    }

  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🤖 MoltRack v0</h1>
      <p>Your AI Bot on Railway</p>
    </header>

    <main>
      <div class="bot-setup">
        <!-- Bot Creation Card -->
        <div class="card" id="botCreationCard" style="display: none;">
          <h3>Create Your Bot</h3>
          <div class="form-group">
            <label for="botName">Bot Name</label>
            <input type="text" id="botName" placeholder="e.g., My Assistant" value="My Bot">
          </div>
          <div class="form-group">
            <label for="botModel">Model</label>
            <select id="botModel">
              <option value="gpt-4-turbo">GPT-4 Turbo</option>
              <option value="gpt-4">GPT-4</option>
              <option value="gpt-3.5-turbo" selected>GPT-3.5 Turbo</option>
              <option value="claude-2">Claude 2</option>
            </select>
          </div>
          <div class="form-group">
            <label for="botSystemPrompt">System Prompt</label>
            <textarea id="botSystemPrompt" placeholder="Define how the bot should behave...">You are a helpful AI assistant.</textarea>
          </div>
          <div class="form-group">
            <label for="apiKey">OpenRouter API Key</label>
            <input type="password" id="apiKey" placeholder="your-openrouter-api-key">
          </div>
          <button onclick="createBot()">Create Bot</button>
          <div id="creationMessage"></div>
        </div>

        <!-- Bot Status Card -->
        <div class="card" id="botStatusCard" style="display: none;">
          <h3>Your Bot</h3>
          <div id="botStatus"></div>
        </div>

        <!-- Bot Actions Card -->
        <div class="card" id="botActionsCard" style="display: none;">
          <h3>Bot Actions</h3>
          <button onclick="updateBotConfig()" class="btn-secondary" style="margin-bottom: 10px;">Update Config</button>
          <button onclick="regenerateToken()" class="btn-secondary" style="margin-bottom: 10px;">Regenerate Token</button>
          <button onclick="deleteBotConfirm()" class="btn-danger">Delete Bot</button>
          <div id="actionMessage" style="margin-top: 10px;"></div>
        </div>
      </div>

      <div class="chat-section">
        <div class="chat-header">
          <h2>Chat with Your Bot</h2>
          <p id="chatSubtitle">Create a bot to get started</p>
        </div>

        <div class="chat-container">
          <div class="messages" id="messages">
            <div class="empty-state">
              <p>No bot created yet</p>
              <p style="font-size: 12px; opacity: 0.6;">Create your first bot to start chatting</p>
            </div>
          </div>

          <div class="input-area" id="inputArea" style="display: none;">
            <input type="text" id="messageInput" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <p>MoltRack v0 • Powered by Railway + OpenRouter</p>
    </footer>
  </div>

  <script>
    // State
    let currentBot = null;
    let authToken = null;
    const API_BASE = 'http://localhost:3001/api';

    // Initialize
    window.addEventListener('load', () => {
      const token = localStorage.getItem('botToken');
      if (token) {
        authToken = token;
        loadBotStatus();
      } else {
        showBotCreation();
      }
    });

    function showBotCreation() {
      document.getElementById('botCreationCard').style.display = 'block';
      document.getElementById('botStatusCard').style.display = 'none';
      document.getElementById('botActionsCard').style.display = 'none';
      document.getElementById('inputArea').style.display = 'none';
      updateChatArea();
    }

    function showBotActive() {
      document.getElementById('botCreationCard').style.display = 'none';
      document.getElementById('botStatusCard').style.display = 'block';
      document.getElementById('botActionsCard').style.display = 'block';
      document.getElementById('inputArea').style.display = 'flex';
      updateChatArea();
    }

    async function createBot() {
      const name = document.getElementById('botName').value.trim();
      const model = document.getElementById('botModel').value;
      const systemPrompt = document.getElementById('botSystemPrompt').value.trim();
      const apiKey = document.getElementById('apiKey').value.trim();

      if (!name || !apiKey) {
        showMessage('Please fill in all fields', 'error', 'creationMessage');
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/bots/create`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, model, systemPrompt, apiKey })
        });

        const data = await response.json();

        if (!response.ok) {
          showMessage(data.message || 'Failed to create bot', 'error', 'creationMessage');
          return;
        }

        authToken = data.token;
        currentBot = data.bot;
        localStorage.setItem('botToken', data.token);
        showMessage('Bot created successfully!', 'success', 'creationMessage');
        
        setTimeout(() => {
          showBotActive();
          displayBotStatus();
        }, 1500);
      } catch (err) {
        showMessage('Error: ' + err.message, 'error', 'creationMessage');
      }
    }

    async function loadBotStatus() {
      try {
        const response = await fetch(`${API_BASE}/bots/me`, {
          headers: { 'Authorization': `Bearer ${authToken}` }
        });

        if (response.status === 404) {
          showBotCreation();
          return;
        }

        if (!response.ok) throw new Error('Failed to load bot');

        currentBot = await response.json();
        showBotActive();
        displayBotStatus();
      } catch (err) {
        console.error(err);
        localStorage.removeItem('botToken');
        authToken = null;
        showBotCreation();
      }
    }

    function displayBotStatus() {
      const html = `
        <div class="bot-info-display">
          <div class="info-row">
            <span class="info-label">Name:</span>
            <span class="info-value">${currentBot.botName || 'Unnamed'}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Model:</span>
            <span class="info-value">${currentBot.model}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Status:</span>
            <span class="status-badge ${currentBot.status || 'loading'}">${(currentBot.status || 'loading').toUpperCase()}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Endpoint:</span>
            <div class="token-display" title="${currentBot.endpoint || 'Loading...'}">${currentBot.endpoint ? currentBot.endpoint.substring(0, 50) + '...' : 'Loading...'}</div>
          </div>
          <div class="info-row">
            <span class="info-label">Token:</span>
            <div class="token-display" title="${authToken}">${authToken.substring(0, 30)}...</div>
          </div>
          <button class="btn-small" onclick="copyToClipboard('${authToken}')" style="margin-top: 10px;">Copy Token</button>
        </div>
      `;
      document.getElementById('botStatus').innerHTML = html;
      document.getElementById('chatSubtitle').textContent = `Chat with ${currentBot.botName || 'Your Bot'}`;
    }

    async function updateBotConfig() {
      const newModel = prompt('Enter new model (leave blank to skip):', currentBot.model);
      if (newModel === null) return;

      const newSystemPrompt = prompt('Enter new system prompt (leave blank to skip):', currentBot.systemPrompt);
      if (newSystemPrompt === null) return;

      try {
        const response = await fetch(`${API_BASE}/bots/update`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify({
            model: newModel || undefined,
            systemPrompt: newSystemPrompt || undefined
          })
        });

        if (!response.ok) throw new Error('Failed to update');

        currentBot = await response.json();
        displayBotStatus();
        showMessage('Bot config updated!', 'success', 'actionMessage');
      } catch (err) {
        showMessage('Error: ' + err.message, 'error', 'actionMessage');
      }
    }

    async function regenerateToken() {
      if (!confirm('Generate a new token? The old one will no longer work.')) return;

      try {
        const response = await fetch(`${API_BASE}/bots/regenerate-token`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${authToken}` }
        });

        if (!response.ok) throw new Error('Failed to regenerate');

        const data = await response.json();
        authToken = data.token;
        localStorage.setItem('botToken', data.token);
        displayBotStatus();
        showMessage('Token regenerated!', 'success', 'actionMessage');
      } catch (err) {
        showMessage('Error: ' + err.message, 'error', 'actionMessage');
      }
    }

    function deleteBotConfirm() {
      const confirm_text = prompt('Type DELETE_BOT to confirm deletion:');
      if (confirm_text === 'DELETE_BOT') {
        deleteBot();
      }
    }

    async function deleteBot() {
      try {
        const response = await fetch(`${API_BASE}/bots/delete`, {
          method: 'DELETE',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify({ confirm: 'DELETE_BOT' })
        });

        if (!response.ok) throw new Error('Failed to delete');

        localStorage.removeItem('botToken');
        authToken = null;
        currentBot = null;
        document.getElementById('messages').innerHTML = '';
        showBotCreation();
        showMessage('Bot deleted', 'success', 'actionMessage');
      } catch (err) {
        showMessage('Error: ' + err.message, 'error', 'actionMessage');
      }
    }

    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const message = input.value.trim();

      if (!message || !currentBot) return;

      input.value = '';

      // Add user message to UI
      addMessageToChat('user', message);

      try {
        const response = await fetch(`${API_BASE}/chat/message`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify({ message })
        });

        if (!response.ok) {
          const error = await response.json();
          addMessageToChat('bot', 'Error: ' + (error.message || 'Failed to get response'));
          return;
        }

        const data = await response.json();
        addMessageToChat('bot', data.response || data.content || 'No response');
      } catch (err) {
        addMessageToChat('bot', 'Error: ' + err.message);
      }
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    function addMessageToChat(role, content) {
      const messagesDiv = document.getElementById('messages');
      
      // Clear empty state if needed
      if (messagesDiv.querySelector('.empty-state')) {
        messagesDiv.innerHTML = '';
      }

      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${role}`;
      messageDiv.innerHTML = `<div class="message-content">${escapeHtml(content)}</div>`;
      messagesDiv.appendChild(messageDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function updateChatArea() {
      const messagesDiv = document.getElementById('messages');
      if (!currentBot) {
        messagesDiv.innerHTML = `
          <div class="empty-state">
            <p>No bot created yet</p>
            <p style="font-size: 12px; opacity: 0.6;">Create your first bot to start chatting</p>
          </div>
        `;
      }
    }

    function showMessage(message, type, elementId) {
      const el = document.getElementById(elementId);
      el.className = type === 'error' ? 'error-message' : 'success-message';
      el.textContent = message;
      el.style.display = 'block';

      if (type === 'success') {
        setTimeout(() => {
          el.style.display = 'none';
        }, 3000);
      }
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert('Copied to clipboard!');
      });
    }

    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }
  </script>
</body>
</html>
